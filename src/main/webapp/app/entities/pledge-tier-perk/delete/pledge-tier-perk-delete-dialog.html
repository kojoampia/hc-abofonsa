@if (pledgeTierPerk) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(pledgeTierPerk.id!)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="pledgeTierPerkDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirm delete operation</h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p
        id="jhi-delete-pledgeTierPerk-heading"
        jhiTranslate="abofonsaPreviewApp.pledgeTierPerk.delete.question"
        [translateValues]="{ id: pledgeTierPerk.id }"
      >
        Are you sure you want to delete Pledge Tier Perk {{ pledgeTierPerk.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button id="jhi-confirm-delete-pledgeTierPerk" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span jhiTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
