<div>
  <div class="d-flex justify-content-center">
    <div class="col-lg-6 col-md-8 col-sm-10">
      <h1 data-cy="loginTitle" jhiTranslate="login.title">Sign in</h1>
      @if (authenticationError()) {
        <div class="alert alert-danger" data-cy="loginError" jhiTranslate="login.messages.error.authentication">
          <strong>Failed to sign in!</strong> Please check your credentials and try again.
        </div>
      }
      <form class="form" (ngSubmit)="login()" [formGroup]="loginForm">
        <div class="mb-3">
          <label class="username-label" for="username" jhiTranslate="global.form.username.label">Username</label>
          <!--
            #username is required, not decorative. login.ts declares
            `viewChild.required<ElementRef>('username')` and dereferences it in ngAfterViewInit to
            focus the field; generator-jhipster 9.1.0 emits the component but not the template
            reference, so every render of this page throws NG0951 ("Child query result is required
            but no value is available") and the rest of ngAfterViewInit never runs.
          -->
          <input
            #username
            type="text"
            class="form-control"
            name="username"
            id="username"
            placeholder="{{ 'global.form.username.placeholder' | translate }}"
            formControlName="username"
            data-cy="username"
          />
        </div>

        <div class="mb-3">
          <label for="password" jhiTranslate="login.form.password">Password</label>
          <input
            type="password"
            class="form-control"
            name="password"
            id="password"
            placeholder="{{ 'login.form.password.placeholder' | translate }}"
            formControlName="password"
            data-cy="password"
          />
        </div>

        <div class="form-check">
          <label class="form-check-label" for="rememberMe">
            <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" />
            <span jhiTranslate="login.form.rememberme">Remember me</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" data-cy="submit" jhiTranslate="login.form.button">Sign in</button>
      </form>
      <!--
        JHipster's "register a new account" and "forgot your password?" links are removed on
        purpose. SecurityConfiguration does not permit /api/register, /api/activate or the
        reset-password endpoints — this application has one privileged account, seeded by Liquibase
        and given its password from ABOFONSA_ADMIN_PASSWORD. Leaving the links would offer an
        operator two flows that can only end in a 401, and advertise a sign-up that does not exist.
        The password is rotated by changing that variable and restarting.
      -->
    </div>
  </div>
</div>
