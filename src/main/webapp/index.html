<!doctype html>
<html class="no-js" lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Health Connect | Abofonsa BridgeCare — Launching 1 February 2027</title>
    <meta name="description" content="Health Connect is decentralizing healthcare in Ghana. Launching 1 February 2027." />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- The launch page's own background, so a hard refresh does not flash white before Angular boots. -->
    <meta name="theme-color" content="#06172b" />

    <!--
      Static Open Graph tags. The launch page is client-rendered, so a crawler that does not execute
      JavaScript sees only this document — putting the share card here rather than setting it from
      the component is what makes the link preview work at all. It is duplicated from the seeded
      LaunchSetting rather than derived from it; if the launch date moves, this file moves too.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Abofonsa BridgeCare" />
    <meta property="og:title" content="Health Connect | Abofonsa BridgeCare" />
    <meta property="og:description" content="Decentralizing healthcare in Ghana. Launching 1 February 2027." />
    <meta property="og:url" content="https://abofonsa.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Health Connect | Abofonsa BridgeCare" />
    <meta name="twitter:description" content="Decentralizing healthcare in Ghana. Launching 1 February 2027." />
    <!--
      Share-card image. Absolute, because a crawler resolves og:image against nothing — a relative
      path here yields a link preview with no picture, which is the whole point of the tag.
      Update the origin alongside PUBLIC_URL if the domain changes.
    -->
    <meta property="og:image" content="https://abofonsa.com/content/images/abofonsa-brand.png" />
    <meta property="og:image:alt" content="Abofonsa BridgeCare — providing peace of mind across borders" />
    <meta name="twitter:image" content="https://abofonsa.com/content/images/abofonsa-brand.png" />
    <base href="/" />
    <link rel="icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webapp" />
    <link rel="stylesheet" href="content/css/loading.css" />
    <!-- jhipster-needle-add-resources-to-root - JHipster will add new resources here -->
  </head>
  <body>
    <!--[if lt IE 9]>
      <p class="browserupgrade">
        You are using an <strong>outdated</strong> browser. Please <a href="https://browsehappy.com/">upgrade your browser</a> to improve
        your experience.
      </p>
    <![endif]-->
    <jhi-app>
      <div class="app-loading">
        <div class="brand-loader" role="img" aria-label="Abofonsa BridgeCare"></div>
        <p class="brand-loader-label">Health Connect</p>
      </div>
      <!--
        Shown only if the bundle has not booted after 4 seconds. generator-jhipster puts its own
        troubleshooting notes here — "you didn't run npm start", links to the JHipster issue tracker
        — which are useful to a developer and wrong for everyone else. This page's stated audience is
        largely on mid-range Android over a slow connection, where four seconds is an ordinary load,
        not a fault. So it says something true and useful to a visitor instead.
      -->
      <div class="app-loading">
        <div id="jhipster-error" style="display: none">
          <h1>Still loading…</h1>
          <p>
            This is taking longer than usual. It is most likely a slow connection rather than anything wrong — the page will appear once it
            finishes.
          </p>
          <p>
            If it does not, reload the page. Still stuck? Email
            <a href="mailto:hello@abofonsa.com">hello@abofonsa.com</a> and we will look into it.
          </p>
        </div>
      </div>
    </jhi-app>
    <noscript>
      <h1>You must enable JavaScript to view this page.</h1>
    </noscript>
    <script type="text/javascript">
      // show an error message if the app loading takes more than 4 sec
      window.onload = function () {
        setTimeout(showError, 4000);
      };
      function showError() {
        const errorElm = document.getElementById('jhipster-error');
        if (errorElm?.style) {
          errorElm.style.display = 'block';
        }
      }
    </script>
  </body>
</html>
