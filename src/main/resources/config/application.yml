---
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

abofonsa:
  admin:
    # Applied to the seeded 'admin' account at every boot by AdminAccountInitializer. Left empty
    # here deliberately — an empty value keeps the development credential and logs a warning, which
    # is the only behaviour that is both safe to commit and usable without setup.
    password: ${ABOFONSA_ADMIN_PASSWORD:}

  # Where the opt-in and unsubscribe links point, and where those endpoints redirect back to.
  # Must be the address the public actually reaches, not the container's own.
  public-base-url: ${ABOFONSA_PUBLIC_BASE_URL:http://localhost:8083}

  privacy:
    # Salts the visitor and IP hashes. Without a secret here the IPv4 space can be exhaustively
    # hashed in minutes, so a leaked capture_event table would be re-identifiable — the hashing
    # would look like protection while providing none. Set it in every deployed environment.
    hash-salt: ${ABOFONSA_HASH_SALT:dev-only-unsafe-salt}

  waitlist:
    # Submissions per client per hour before the endpoint answers 429.
    max-per-hour-per-client: ${ABOFONSA_WAITLIST_MAX_PER_HOUR:5}

  events:
    # Analytics beacons per client per hour before /api/public/events answers 429. Counted in memory
    # per instance, unlike the waitlist cap which is counted in the database.
    #
    # Deliberately generous: a real visit fires a page view, a few section views and perhaps a click,
    # so 600 is two orders of magnitude above anybody reading the page and still bounds what a script
    # can write to capture_event.
    max-per-hour-per-client: ${ABOFONSA_EVENTS_MAX_PER_HOUR:600}
