# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

spring:
  application:
    name: abofonsaPreview
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: test
  jackson2:
    serialization:
      write-durations-as-timestamps: false
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  security:
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth
  task:
    execution:
      thread-name-prefix: abofonsa-preview-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: abofonsa-preview-scheduling-
      pool:
        size: 20
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
jhipster:
  clientApp:
    name: 'abofonsaPreviewApp'
  mail:
    from: abofonsaPreview@localhost.com
    base-url: http://127.0.0.1:8080
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
  security:
    # Mirrors src/main/resources/config/application.yml.
    #
    # This file *replaces* the main one — same path on the classpath, test-classes first — so
    # anything not repeated here silently falls back to jhipster-framework's own default. That
    # default is the generator's stock CSP: close enough to the real one to look right in a test
    # failure, and permissive of `unsafe-eval` and a Google bucket that the real one is not.
    # SecurityHeadersIT asserts on the tightened directives, so the tightened policy has to be what
    # is under test.
    content-security-policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    authentication:
      jwt:
        # This token must be encoded using Base64 (you can type `echo 'secret-key'|base64` on your command line)
        base64-secret: OTVmMTM5NzRkZWMzMDkzNWI4MWY1Yzk3MzcwMzAyZDNlM2RkNzhiMWIwMzdlNGI3ZTU4ZDdiNGUyZmU2ODE4NGJmMDQzZDFhYWY0NTk1MzZjMGY5YWY2NzQ3MTc5ZWQyOTY2ZjBmZGNjMDdmMWVkODAxYWJkYzhjOTNiY2RkMTM=
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 86400

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
