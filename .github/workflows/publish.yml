name: Publish image (GHCR)

# The "github" deployment channel: builds the same image `deploy/build.sh` builds locally, but on a
# GitHub runner, and pushes it to this repository's GitHub Container Registry namespace
# (ghcr.io/<owner>/abofonsa-preview) instead of the private docker.jojoaddison.net one.
#
# Nothing here touches the production server. Releasing stays a deliberate, human-run step:
#
#   ./deploy/deploy.sh --channel github                  # deploy this commit's GHCR image
#   TAG=<sha> ./deploy/deploy.sh --channel github        # roll back to any published tag
#
# One image, not two. This is a JHipster monolith: `-Pprod` compiles the Angular bundle into the
# jar's static resources, so Spring Boot serves the launch page, the public API and the admin
# dashboard from one process.
#
# Built by **jib**, not `docker/build-push-action` — JHipster generates no Dockerfile, and the
# `jib-maven-plugin` configuration in `pom.xml` is the image definition. jib pushes straight to the
# registry from the JVM, so there is no daemon build and no buildx layer cache to configure; what
# it caches instead is `~/.m2`, handled by setup-java below.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: # publish any branch on demand, e.g. to test a change on the server first

# Serialise per ref and never cancel a run mid-push. A cancelled jib push can leave a manifest
# referencing blobs it never finished uploading, which `deploy.sh --channel github` would then see
# as a published tag that fails to pull.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: abofonsa-preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # what pushing to ghcr.io with GITHUB_TOKEN requires
    steps:
      # Every action is pinned to a commit SHA, with the version in a trailing comment. A moving tag
      # like `@v4` is whatever the owner last pushed to it, and these run in a job holding a token
      # with `packages: write` — a retagged or compromised action would publish under our name.
      # Dependabot updates the SHAs and the comments together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # JDK 21, not the runner's default. JHipster's maven-enforcer rejects anything outside
      # 21-25 outright ("JHipster supports JDK 21 to 25"), so the build fails before it compiles
      # anything. Same pin as `.java-version` and `deploy/build.sh`.
      #
      # No setup-node step: `frontend-maven-plugin` downloads its own Node (`<node.version>` in
      # pom.xml, currently v24.16.0) into the build directory and caches the tarball under ~/.m2.
      # The runner's Node is never consulted, so `.nvmrc` — which pins 24.18.0 for local work — is
      # deliberately not read here.
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      # `npm install` runs inside -Pprod. Without this it re-downloads the whole dependency tree
      # on every run; ~/.m2 (cached above) holds the Node tarball but not the npm packages.
      - name: Cache the npm download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      # The build that produced the currently deployed image would have caught eight high-severity
      # Angular advisories, had anything been looking. Production dependencies only: the dev tree
      # carries build-tooling advisories that never reach a browser, and failing on those would
      # train everybody to ignore this step.
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail

          # GHCR namespaces are case-sensitive and must be lowercase; the GitHub owner name is not
          # guaranteed to be, so fold it rather than assuming.
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO="ghcr.io/${OWNER}/abofonsa-preview"

          # deploy.sh and build.sh both default TAG to `git rev-parse --short HEAD`, so that string
          # has to be among the tags published here. It is a poor *primary* tag, though: git's
          # abbreviation length is object-count dependent, and actions/checkout makes a shallow
          # clone holding far fewer objects than a full local one, so `--short` here can disagree
          # with `--short` there — and the primary tag is the one everything else is derived from.
          # Take the fixed 7-character prefix of GITHUB_SHA, which depends on nothing, and let the
          # git-abbreviated form ride along as an extra tag on the rare occasion it differs.
          SHA_TAG="${GITHUB_SHA:0:7}"
          EXTRA=()
          GIT_ABBREV="$(git rev-parse --short HEAD)"
          [[ "$GIT_ABBREV" == "$SHA_TAG" ]] || EXTRA+=("$GIT_ABBREV")

          # `latest` is what compose.yml falls back to when .env carries no TAG, so only ever move
          # it on a default-branch build — never on a workflow_dispatch run of some feature branch.
          if [[ "${GITHUB_REF}" == "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            EXTRA+=("latest")
          fi

          # A pushed release tag (v1.2.3) becomes an image tag of the same name.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            EXTRA+=("${GITHUB_REF#refs/tags/}")
          fi

          # jib takes one fully-qualified image and the rest as bare tag names. `extra_tags` is empty
          # for a workflow_dispatch run of a non-default branch — the build step must then omit
          # -Djib.to.tags entirely rather than pass an empty one, which jib reads as a tag named "".
          echo "image=${REPO}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "extra_tags=$(IFS=,; echo "${EXTRA[*]}")" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          # Always non-empty (SHA_TAG is always there), so the summary can split it without
          # producing a bare "repo:" line.
          echo "all_tags=$(IFS=,; echo "${SHA_TAG}${EXTRA[@]+,${EXTRA[*]}}")" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

          echo "Publishing:"
          for t in "${SHA_TAG}" ${EXTRA[@]+"${EXTRA[@]}"}; do echo "  ${REPO}:${t}"; done

      # jib reads ~/.docker/config.json for registry credentials — `auths` entries, `credsStore` and
      # `credHelpers` alike — which is exactly what this writes. It never talks to a Docker daemon,
      # so this step is about the credential file and nothing else.
      #
      # The alternative, -Djib.to.auth.username/password, would put the token on the process command
      # line. Actions masks it in the log, but not in `ps`. There is no environment-variable form:
      # JIB_TARGET_IMAGE_USERNAME/PASSWORD belong to the standalone Jib CLI, and jib-maven-plugin
      # ignores them — an authentication failure that looks exactly like a permissions problem.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (jib, -Pprod, tests run)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          EXTRA_TAGS: ${{ steps.meta.outputs.extra_tags }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          ARGS=(-Djib.to.image="$IMAGE" -Djib.console=plain)
          # Omitted, not passed empty: jib reads `-Djib.to.tags=` as a request for a tag named "".
          [[ -n "$EXTRA_TAGS" ]] && ARGS+=(-Djib.to.tags="$EXTRA_TAGS")
          # image.source is what links the published package back to this repository on GitHub.
          ARGS+=(-Djib.container.labels="org.opencontainers.image.source=${SOURCE_URL},org.opencontainers.image.revision=${REVISION}")

          # `verify` before `jib:build`, matching deploy/build.sh: this is the last gate before an
          # image can be deployed, and this repository has no separate CI workflow that would have
          # run the suite already. Testcontainers needs a Docker daemon — ubuntu-latest ships one.
          ./mvnw -ntp --batch-mode -Pprod verify jib:build "${ARGS[@]}"

      # A push is not published until the registry serves it. Run 30689039960 is why this step
      # exists: every step went green and `latest` appeared, but no SHA tag was ever resolvable
      # afterwards, so `deploy.sh --channel github` failed its published-tag check against a build
      # that claimed success. Whatever swallowed that tag, asserting the end state here turns it
      # into a red run instead of a deploy-time surprise.
      #
      # `buildx imagetools inspect` rather than `docker manifest inspect`: it reads the same
      # ~/.docker/config.json the login step wrote, and needs no experimental CLI flag.
      #
      # Retried, because a registry may serve a manifest a moment after accepting it and a false
      # red here would be worse than the bug — but bounded, so a tag that never lands still fails.
      - name: Verify every tag resolves in the registry
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          ALL_TAGS: ${{ steps.meta.outputs.all_tags }}
        run: |
          set -euo pipefail

          missing=()
          for t in $(tr ',' ' ' <<<"$ALL_TAGS"); do
            resolved=false
            for attempt in 1 2 3 4 5 6; do
              if docker buildx imagetools inspect "${REPO}:${t}" >/dev/null 2>&1; then
                resolved=true
                break
              fi
              sleep 5
            done
            if $resolved; then
              echo "ok      ${REPO}:${t}"
            else
              echo "MISSING ${REPO}:${t}"
              missing+=("$t")
            fi
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::jib reported success, but these tags do not resolve in the registry: ${missing[*]}"
            exit 1
          fi

      - name: Summary
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          ALL_TAGS: ${{ steps.meta.outputs.all_tags }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          {
            echo "### abofonsa-preview"
            echo ""
            echo '```'
            tr ',' '\n' <<<"$ALL_TAGS" | sed "s|^|${REPO}:|"
            echo '```'
            echo ""
            echo "Deploy with: \`TAG=${SHA_TAG} ./deploy/deploy.sh --channel github\`"
          } >> "$GITHUB_STEP_SUMMARY"
