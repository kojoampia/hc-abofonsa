# Deployed as /etc/nginx/snippets/abofonsa-security-headers.conf on webserver and `include`d from
# every proxying location in abofonsa-preview.conf.
#
# Why this exists at all: the application emits these headers on /api/** and, under the `prod`
# profile only, does *not* emit them on HTML documents. `GET /` and `GET /login` came back with no
# Content-Security-Policy, no X-Frame-Options, no Referrer-Policy and no nosniff, while
# `GET /api/public/content` carried the full set. A CSP on a JSON response protects nothing — it
# governs the document that loads the scripts, and that document was the bare one.
#
# The Spring-side cause is still unidentified. `SecurityHeadersIT` boots a real container and the
# headers are present there, so it does not reproduce outside the prod profile; it is not nginx
# either, since `curl http://127.0.0.1:8084/` on the host is equally bare. Rather than keep guessing
# at a framework's behaviour, the edge asserts the headers unconditionally. That is a better place
# for them regardless: it is one file, it covers static and proxied responses alike, and it does not
# depend on which dispatch path served the request.
#
# `proxy_hide_header` before each `add_header` is the load-bearing detail. /api/** genuinely does
# carry these from Spring, and emitting them twice is worse than not emitting them at all — a
# duplicated X-Frame-Options is discarded outright by some browsers, and two CSP headers are
# enforced as the intersection of both policies, which is a subtle way to break a page later.
# Hiding the upstream copy first guarantees exactly one of each, everywhere.
#
# Keep the CSP identical to jhipster.security.content-security-policy in
# src/main/resources/config/application.yml. If they drift, whichever is stricter silently wins.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), sync-xhr=()" always;

# One year, and deliberately without includeSubDomains. The apex is shared: web.abofonsa.com and
# fund.abofonsa.com are separate applications on this same host, and asserting a policy on somebody
# else's subdomain from here would take one of them offline for a year if it ever answered on plain
# HTTP — with no way to retract it from a browser that had already seen the header. Add it, and
# preload, once every subdomain is known to be HTTPS-only.
#
# Safe to send from this snippet because it is included only from the TLS server block; the port-80
# block does nothing but redirect, and HSTS on a plaintext response is ignored anyway.
add_header Strict-Transport-Security "max-age=31536000" always;
