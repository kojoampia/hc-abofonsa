# Deployed as /etc/nginx/conf.d/abofonsa-preview-rum.conf on webserver.
#
# Rate-limit zone for the browser RUM ingest at https://abofonsa.com/v1/traces.
#
# This MUST be its own file rather than part of the vhost: `limit_req_zone` is only valid in nginx's
# `http` context, and sites-available/*.conf are included inside it as `server` blocks. Put it in the
# vhost and `nginx -t` fails with "directive is not allowed here"; enable the vhost without this file
# and it fails with "unknown limit_req zone". Install both, or neither and drop the /v1/traces block
# from the vhost.
#
# A SEPARATE ZONE FROM hc-professional's
#
# `rum_ingest` already exists, defined by hc-professional-rum.conf, and nginx would happily let this
# vhost reuse it. It is deliberately not reused. Sharing the zone would mean one visitor's budget is
# spent across two unrelated applications, and — worse — that removing or renaming the other app's
# conf.d file silently breaks this site's config reload. Two apps, two zones, no coupling.
#
# SIZING
#
# 2 r/s with burst=10, matching the sibling because the client behaviour is the same: the SDK batches
# spans and flushes every couple of seconds, so one open tab sits well under 1 r/s, and the burst
# covers a page load firing document-load, route and XHR spans together. Anything sustained above
# that is not a tab.
#
# 10m holds roughly 160k source addresses, far more than this host will ever see. The key is
# $binary_remote_addr, so one abusive client is capped without affecting anyone else. A distributed
# flood is not stopped by this alone — what bounds that is the collector pipeline, which exports
# browser spans to Tempo and nothing else. The worst case is trace storage; never Mimir's active
# series, never Loki's log volume, never the alerting path.
limit_req_zone $binary_remote_addr zone=abofonsa_rum:10m rate=2r/s;
