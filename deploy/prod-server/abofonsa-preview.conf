# Deployed as /etc/nginx/sites-available/abofonsa-preview.conf on webserver, symlinked into
# sites-enabled. Named after the app (matching abofonsa.conf / hc-crowdfunding.conf), not the
# literal domain.
#
# This is the pre-Certbot bootstrap version — HTTP only. Once DNS points here and this file is
# enabled, run:
#
#   certbot --nginx -d abofonsa.com -d www.abofonsa.com
#
# which rewrites this file in place, adding the TLS server block and the HTTP->HTTPS redirect,
# exactly as it has for every other conf in sites-enabled. Do not hand-write the TLS block;
# certbot's rewrite is what keeps renewal working.
#
# Serves the apex and www. Claiming an apex is not something to do by accident — a server block here
# takes it over for anything resolving to this host — so this was confirmed before deploying:
# `abofonsa.conf` claims only `web.abofonsa.com`, the existing certificates cover only `web.` and
# `fund.`, and the apex answered 404 from nginx's default site. Nothing was displaced.
#
# www is served by the same block rather than redirected to the apex. A redirect is the tidier
# choice for a site with history and inbound links; this one has neither yet, and one certificate
# covering both is the simpler thing to keep renewing.

server {
    listen 80;
    listen [::]:80;
    server_name abofonsa.com www.abofonsa.com;

    # The largest request this app accepts is a waitlist form post. 1 MB is already generous; the
    # default is fine and left alone.

    # Compression. nginx.conf sets `gzip on` globally but leaves `gzip_types` commented out, so only
    # text/html is compressed by default — which would ship the ~243 kB Angular bundle uncompressed
    # to an audience largely on mid-range Android over a slow connection. Both settings matter:
    #
    #   gzip_types    — Spring Boot labels the bundles `text/javascript`, so listing only
    #                   `application/javascript` would silently miss every one of them.
    #   gzip_proxied  — this all arrives via proxy_pass, and nginx does not compress proxied
    #                   responses unless told to.
    #
    # Per-server rather than global, matching how the sibling apps on this host do it.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # One upstream. This is a JHipster monolith: the same Spring Boot process serves the Angular
    # bundle, /api/public/**, and the admin API, so nginx has nothing to fan out.
    location / {
        include snippets/abofonsa-security-headers.conf;
        proxy_pass                          http://127.0.0.1:8084;
        proxy_http_version                  1.1;
        proxy_set_header  Host              $http_host;
        proxy_set_header  X-Real-IP         $remote_addr;
        # VisitorContextService derives the salted IP hash — and therefore the waitlist rate limit —
        # from X-Forwarded-For. Without this header every visitor looks like the proxy and shares one
        # bucket, so the sixth signup of the hour from anybody starts returning 429 to everybody.
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Forwarded-Host  $http_host;
        proxy_read_timeout                  60s;
    }

    # Hashed filenames are immutable, so let nginx answer repeat visits without waking the JVM.
    # index.html is deliberately not cached here — a deploy must be visible immediately, and it is
    # the file that names the new hashed bundles.
    location ~* \.(?:js|css|woff2?|svg|ico|png|webmanifest)$ {
        include snippets/abofonsa-security-headers.conf;
        proxy_pass                          http://127.0.0.1:8084;
        proxy_set_header  Host              $http_host;
        proxy_cache_valid                   200 1y;
        add_header        Cache-Control     "public, max-age=31536000, immutable";
    }

    # /management is not proxied at all. Health, metrics and the Prometheus endpoint belong to the
    # monitoring network, which reaches the container directly over the shared Docker network. Not
    # exposing them here is a second, independent reason they never become publicly reachable —
    # /management/health is anonymous by design, and the rest requires ROLE_ADMIN.
    location /management {
        return 404;
    }

    access_log /var/log/nginx/abofonsa-preview.access.log;
    error_log  /var/log/nginx/abofonsa-preview.error.log;
}
