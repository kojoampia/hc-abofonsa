# Deployed as ~/webroot/01-healthconnect/abofonsa-preview/compose.yml on webserver, following that
# host's per-app convention (see the sibling hc-abofonsa-web and hc-crowdfund-app): a dedicated
# external network, loopback-only published ports because host nginx owns TLS and public routing,
# and container names prefixed per app.
#
# `name:` is pinned explicitly so `docker compose up -d --remove-orphans` (see ./start) can only
# ever affect this project's containers — relying on the directory-derived default once cost a
# sibling app an unrelated container that happened to share the name.
#
# One image, not two. This is a JHipster monolith: Spring Boot serves the compiled Angular bundle
# from its own classpath, so there is no separate web container and nginx has exactly one upstream.
name: hc-abofonsa-preview

services:
  postgresql:
    image: postgres:18.4
    container_name: abofonsa-preview-postgres
    restart: unless-stopped
    networks:
      - abofonsapreviewnet
    environment:
      POSTGRES_DB: abofonsaPreview
      POSTGRES_USER: abofonsaPreview
      # No POSTGRES_HOST_AUTH_METHOD=trust here, unlike the dev compose file. Trust auth is fine on
      # a loopback-only dev container and is an unauthenticated database anywhere else.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -base64 24)}
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. The 18+ images store data in a
      # major-version-specific subdirectory so that `pg_upgrade --link` works without a mount-point
      # boundary in the way, and they refuse to start when they find a volume on the old path —
      # "there appears to be PostgreSQL data in: /var/lib/postgresql/data (unused mount/volume)".
      # The dev compose file never hits this because its volume line is commented out.
      - postgres-data:/var/lib/postgresql
    # Deliberately publishes no port. Nothing outside this network has any business reaching the
    # database, and backup.sh reaches it with `docker exec`.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    image: ${REGISTRY:-docker.jojoaddison.net}/abofonsa-preview:${TAG:-latest}
    container_name: abofonsa-preview-app
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - abofonsapreviewnet
      # External, shared with the rest of this server's apps (~/webroot/00-admin/monitoring) — lets
      # Prometheus scrape /management/prometheus. See infra.sh: this network is NOT created here.
      - monitoring
    environment:
      # `prod` only. `secret-samples` is a member of the *dev* profile group and carries a committed
      # JWT signing key — activating it here would sign production sessions with a secret that is in
      # the repository and in every clone of it.
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/abofonsaPreview
      SPRING_DATASOURCE_USERNAME: abofonsaPreview
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_LIQUIBASE_URL: jdbc:postgresql://postgresql:5432/abofonsaPreview

      # HS512 needs >= 64 bytes of key material. Fail fast and loudly rather than booting unsigned:
      # unlike the dev profile there is no sample to fall back on, which is the point.
      #   openssl rand -base64 64 | tr -d '\n'
      JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET: ${JWT_BASE64_SECRET:?Set JWT_BASE64_SECRET in .env (openssl rand -base64 64)}

      # Applied to the seeded `admin` account at every boot by AdminAccountInitializer. Unset, the
      # account keeps generator-jhipster's committed `admin`/`admin` credential — which is why this
      # is required rather than defaulted.
      ABOFONSA_ADMIN_PASSWORD: ${ABOFONSA_ADMIN_PASSWORD:?Set ABOFONSA_ADMIN_PASSWORD in .env}

      # Salts the visitor and IP hashes. Required, not defaulted: unsalted, the entire IPv4 space can
      # be hashed in minutes, so capture_event would be re-identifiable and the hashing would look
      # like protection while providing none. Changing it resets every rate-limit counter and makes
      # UNIQUE_VISITORS discontinuous across the change.
      ABOFONSA_HASH_SALT: ${ABOFONSA_HASH_SALT:?Set ABOFONSA_HASH_SALT in .env (openssl rand -base64 32)}

      # Where the opt-in and unsubscribe links in outgoing email point, and where those endpoints
      # redirect back to. Must be the address the public actually reaches — a container-internal
      # value here emails people a link to a host that does not exist for them.
      ABOFONSA_PUBLIC_BASE_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      ABOFONSA_WAITLIST_MAX_PER_HOUR: ${WAITLIST_MAX_PER_HOUR:-5}

      # Mail is optional. With no host configured the confirmation link is logged instead of sent and
      # the opt-in flow still completes — useful for a first deploy, useless for a real waitlist.
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS:-true}
      JHIPSTER_MAIL_FROM: ${MAIL_FROM:-noreply@abofonsa.com}
      JHIPSTER_MAIL_BASE_URL: ${PUBLIC_URL}

      # The browser must be allowed to call the API from the public origin. JHipster's WebSocket and
      # CORS handling both read this; empty means same-origin only, which is correct here because
      # the monolith serves its own frontend.
      JHIPSTER_CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}

      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: 'true'
      JAVA_OPTS: '-XX:MaxRAMPercentage=75 -XX:+UseZGC'
      # The generated entrypoint sleeps this many seconds before starting, a hook for waiting on
      # dependencies. depends_on/condition already does that properly, so no sleep.
      JHIPSTER_SLEEP: '0'
    ports:
      # Loopback only — host nginx (Certbot-managed TLS) is the sole thing on a public interface,
      # matching every other app on this server.
      - '127.0.0.1:${APP_PORT:-8084}:8080'
    read_only: true
    tmpfs:
      # Spring Boot and Liquibase both write here, and the image's own entrypoint expects it. With a
      # read-only root and no tmpfs the container starts and then fails on the first temp file.
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # bash's /dev/tcp rather than curl or wget: the temurin JRE base image ships neither, so the
      # obvious healthcheck silently reports unhealthy forever on a container that is fine.
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /management/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"\\\"status\\\":\\\"UP\\\"\" <&3'"
      interval: 10s
      timeout: 5s
      retries: 30
      # Wide on purpose. Liquibase runs 19 changelogs and the metrics backfill runs on startup, on a
      # single-core host. This is expected, not a hang — deploy.sh waits it out.
      start_period: 120s

networks:
  abofonsapreviewnet:
    external: true
  monitoring:
    external: true

volumes:
  postgres-data:
